name: Automatisation Unicode

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *'   # tous les jours à minuit UTC
  workflow_dispatch:      # permet aussi le lancement manuel

concurrency:
  group: unicode-automation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
         

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Générer le site (données + pages SEO + sitemap)
        run: python script.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ADSENSE_ID: ${{ vars.ADSENSE_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      - name: Sauvegarder les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter"
          else
            git commit -m "Mise à jour automatique des données Unicode"
            git push
          fi
